# Reverse-proxies /api/* to the backend Compose service — the container-
# native equivalent of vite.config.ts's dev-only proxy (Stage C2 §4.7). The
# browser only ever talks to this nginx origin, so the frontend keeps calling
# relative /api/... paths exactly as it does in dev, and no CORS
# configuration is needed anywhere.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # SPA client-side routing (react-router) — a direct load or reload of
        # e.g. /overview must resolve to index.html, not 404 at nginx.
        try_files $uri /index.html;
    }
}
