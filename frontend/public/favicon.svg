<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Tenora">
  <!-- Tenora's canonical mark: the flat solid accent square used by
       src/components/layout/Wordmark.tsx (size-2 bg-accent-600). No container,
